# Internal Govi defaults. All user appearance preferences are managed in Settings.
font-family = JetBrains Mono
font-size = 14
font-thicken = false
font-feature = -liga
font-feature = -calt
adjust-cell-height = 8%
background = 141618
foreground = d8dce3
cursor-color = a8baff
cursor-style = bar
cursor-style-blink = false
selection-background = 2a2d33
selection-foreground = d8dce3
palette = 0=#363b36
palette = 1=#b65d4c
palette = 2=#5e8054
palette = 3=#a8843f
palette = 4=#617f96
palette = 5=#917292
palette = 6=#5c8d88
palette = 7=#e9e8e0
palette = 8=#8d9387
palette = 9=#c86a56
palette = 10=#7e9d63
palette = 11=#bd9f59
palette = 12=#7c9bb0
palette = 13=#ac8aab
palette = 14=#7eaaa1
palette = 15=#f7f6f0
window-padding-x = 14
window-padding-y = 14
window-width = 140
window-height = 38
window-theme = dark
unfocused-split-opacity = 1
macos-titlebar-style = hidden
window-save-state = always
mouse-hide-while-typing = true
copy-on-select = false
confirm-close-surface = true
quit-after-last-window-closed = false
resize-overlay = never
shell-integration = detect
shell-integration-features = cursor,sudo,title,ssh-env
keybind = super+shift+p=toggle_command_palette
keybind = super+k=toggle_command_palette
keybind = super+d=new_split:right
keybind = super+shift+d=new_split:down
keybind = super+shift+enter=toggle_split_zoom
keybind = super+alt+left=goto_split:left
keybind = super+alt+right=goto_split:right
keybind = super+alt+up=goto_split:up
keybind = super+alt+down=goto_split:down

# Govi exposes Settings directly; no upstream config reload or developer inspector.
keybind = super+shift+comma=unbind
keybind = super+alt+i=unbind
