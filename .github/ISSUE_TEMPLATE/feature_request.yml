name: Feature request
description: Suggest an idea or improvement.
labels: ["enhancement", "needs triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you're trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Optional. How you imagine it working.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Optional. What you do today instead.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself.
